name: CI

on:
  pull_request:
    branches:
      - master
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        ocaml-version: [4.14.1]
        node-version: [24]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Setup OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
          opam-pin: false
          opam-depext: false

      - name: Set Opam repository
        run: |
          opam repo set-url default git+https://github.com/ocaml/opam-repository.git#a52dd1c5b0298d669078ed99d219623a6bf0f0c1 --yes
          opam update

      - name: Install Opam deps
        run: opam install . --deps-only --with-test --yes

      - name: Build PPX
        run: opam exec -- dune build

      - name: Link PPX for ReScript apps
        run: ln -sf ../_build/default/ppx/bin/bin.exe node_modules/re-formality-ppx

      - name: Build ReScript packages
        run: |
          pnpm --filter re-formality run build
          pnpm --filter re-formality-examples run build

      - name: Run PPX tests
        run: opam exec -- dune exec test.exe

      - name: Run integration tests
        run: pnpm --filter re-formality-specs run test

  build_macos:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
    strategy:
      matrix:
        os: [macos-13, macos-14]
        ocaml-version: [4.14.1]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
          opam-pin: false
          opam-depext: false

      - name: Set Opam repository
        run: |
          opam repo set-url default git+https://github.com/ocaml/opam-repository.git#a52dd1c5b0298d669078ed99d219623a6bf0f0c1 --yes
          opam update

      - name: Install Opam deps
        run: opam install . --deps-only --with-test --yes

      - name: Build PPX
        run: opam exec -- dune build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: _build/default/ppx/bin/bin.exe

  build_linux:
    name: Build on ${{ matrix.container-os }}
    runs-on: ${{ matrix.host-os }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
    strategy:
      matrix:
        host-os: [ubuntu-22.04]
        container-os: [linux-alpine-3]
        ocaml-version: [4.14.1]
    container:
      image: alex35mil/alpine-ocaml-opam-node-pnpm:alpine-3.19-ocaml-4.14-node-24.18-pnpm-11.10-7mhu

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup OCaml ${{ matrix.ocaml-version }}
        run: opam init -a --disable-sandboxing --compiler=${{ matrix.ocaml-version }}

      - name: Set Opam repository
        run: |
          opam repo set-url default git+https://github.com/ocaml/opam-repository.git#a52dd1c5b0298d669078ed99d219623a6bf0f0c1 --yes
          opam update

      - name: Install Opam deps
        run: opam install . --deps-only --with-test --yes

      - name: Build PPX
        run: opam exec -- dune build --profile static

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.container-os }}
          path: _build/default/ppx/bin/bin.exe

  build_windows:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
    strategy:
      matrix:
        os: [windows-latest]
        ocaml-version: [4.14.1]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Apply Opam deps patch
        run: |
          $lastCommitterName = git log -1 --pretty=format:'%an'
          $lastCommitterEmail = git log -1 --pretty=format:'%ae'
          git config user.name "$lastCommitterName"
          git config user.email "$lastCommitterEmail"
          git apply windows.patch
          git add .
          git commit -m "Patch opam deps"

      - name: Setup OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
          opam-pin: false
          opam-depext: false

      - name: Pin Opam deps
        run: |
          opam pin add dune https://github.com/ocaml/dune.git#7cbb0e7 # 3.11.1
          opam pin add ppxlib https://github.com/ocaml-ppx/ppxlib.git#f0496c9 # 0.30.0
          opam pin add alcotest https://github.com/mirage/alcotest.git#927088f # 1.7.0

      - name: Install Opam deps
        run: opam install . --deps-only --with-test --yes

      - name: Build PPX
        run: opam exec -- dune build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: _build/default/ppx/bin/bin.exe

  prepare_release:
    needs:
      - build_macos
      - build_linux
      - build_windows
    name: Prepare release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download macOS x86 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-13
          path: _bin/darwin/intel

      - name: Download macOS ARM artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-14
          path: _bin/darwin/arm

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-alpine-3
          path: _bin/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-latest
          path: _bin/windows

      - name: Move artifacts
        run: |
          mkdir -p _release/bin
          mv _bin/darwin/intel/bin.exe _release/bin/re-formality-ppx-darwin-x64.exe
          mv _bin/darwin/arm/bin.exe _release/bin/re-formality-ppx-darwin-arm64.exe
          mv _bin/linux/bin.exe _release/bin/re-formality-ppx-linux-x64.exe
          mv _bin/windows/bin.exe _release/bin/re-formality-ppx-win-x64.exe
          rm -rf _bin

      - name: Move lib files
        run: |
          mkdir -p _release/src
          cp README.md _release/README.md
          cp lib/rescript.json _release/rescript.json
          cp -a lib/src/. _release/src/
          cp .github/workflows/scripts/postinstall.js _release/postinstall.js
          node .github/workflows/scripts/write-package-json.js

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: _release
